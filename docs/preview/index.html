<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH-SDT · 默认主题演示（v1.2）</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font: 16px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background:#f7f3ea; color:#231f19; }
  header { padding: 40px 32px 8px; }
  h1 { font: 600 28px/1.3 "Noto Serif SC", Georgia, serif; margin:0 0 6px; }
  p.lead { margin:0; color:#6b6357; }
  .badge { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px;
           background:#c8a24a; color:#231f19; font-size:12px; vertical-align:middle; }
  main { display:grid; gap:28px; padding: 24px 32px 56px; grid-template-columns: 1fr; }
  @media (min-width: 1100px) { main { grid-template-columns: 1fr 1fr; } }
  figure { margin:0; background:#fff; border:1px solid #e2dccf; border-radius:12px; overflow:hidden;
           box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.08); }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:10px 14px; font-size:13px; color:#6b6357; border-top:1px solid #eee6d6; }
  footer { padding: 0 32px 48px; color:#6b6357; font-size:13px; }
  code { background:#efe9dc; padding:.1em .35em; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>DSH-SDT <span class="badge">v1.2</span></h1>
  <p class="lead">DeepSeek Harness 主题插件 · 默认主题实机截图（插件装进 <code>web</code> profile 后拍摄）</p>
</header>
<main>
  <figure>
    <img src="theme-light.png" alt="浅色：纸白底 + 金色主按钮 + 衬线正文">
    <figcaption>浅色 · 背景 <code>#f7f3ea</code>，主按钮 <code>rgb(200,162,74)</code>，正文衬线</figcaption>
  </figure>
  <figure>
    <img src="theme-dark.png" alt="深色预览：近黑底 + 金品牌色">
    <figcaption>深色预览 · 背景 <code>#0d1117</code>，品牌 <code>#cfad60</code>（算法值直应用，非偏好切换）</figcaption>
  </figure>
</main>
<footer>
  说明：截图来自本机隔离实例，界面内容为 DSH 原生界面；主题只改颜色 / 字体 / 圆角变量，不改布局。
  详情见 <code>docs/MODULARITY.md</code>（能力矩阵）与 <code>docs/JOURNAL.md</code>（交付记录）。
</footer>
</body>
</html>
